<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pricewise · Track prices</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#172b25;--muted:#74817a;--green:#1c493b;--mint:#d6f0dd;--line:#e8ede9;--bg:#f8faf8;--amber:#fff2cc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px 'DM Sans',sans-serif}.shell{max-width:1180px;margin:auto;padding:26px 30px 64px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:35px}.brand{display:flex;align-items:center;gap:11px;font:800 20px Manrope}.logo{width:38px;height:38px;border-radius:12px;background:var(--green);display:grid;place-items:center;color:white;font-size:21px}.topright{color:var(--muted);font-size:13px}.hero{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:25px}.eyebrow{color:#558768;font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase}.hero h1{font:800 34px Manrope;margin:8px 0}.hero p{color:var(--muted);margin:0}.addbox{background:white;border:1px solid var(--line);padding:8px;border-radius:14px;display:flex;gap:8px;width:min(560px,100%);box-shadow:0 7px 20px #1b3f2910}.addbox input{border:0;outline:0;flex:1;padding:0 12px;font:14px 'DM Sans';min-width:0}.btn{background:var(--green);color:white;border:0;border-radius:10px;padding:13px 18px;font:700 14px 'DM Sans';cursor:pointer}.btn:disabled{opacity:.55;cursor:wait}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:24px 0 32px}.stat{background:white;border:1px solid var(--line);border-radius:15px;padding:17px 19px}.stat small{color:var(--muted)}.stat strong{display:block;font:700 23px Manrope;margin-top:8px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.sectionhead h2{font:700 20px Manrope;margin:0}.count{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.card{background:white;border:1px solid var(--line);border-radius:17px;padding:17px;min-width:0}.cardtop{display:flex;gap:14px}.thumb{width:76px;height:76px;background:#f3f6f3;border-radius:12px;display:grid;place-items:center;flex:none;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:contain}.placeholder{font-size:28px;color:#83a18d}.product{min-width:0;flex:1}.product h3{font:700 15px/1.4 Manrope;margin:2px 0 7px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.seller{font-size:12px;color:var(--muted)}.price{font:800 23px Manrope;margin-top:8px}.price span{font:500 12px 'DM Sans';color:var(--muted)}.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.badge{font-size:11px;border-radius:20px;padding:5px 9px;background:#f0f4f1;color:#59685f}.badge.alert{background:var(--mint);color:#236343}.badge.cheaper{background:#e9f4ff;color:#27628d}.badge.warn{background:var(--amber);color:#795b14}.chartwrap{margin:16px 0 10px;height:74px}.chart{width:100%;height:100%;overflow:visible}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}.targetrow{border-top:1px solid var(--line);margin-top:13px;padding-top:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}.targetedit{display:flex;gap:6px}.targetedit input{width:96px;border:1px solid var(--line);border-radius:8px;padding:7px;font:12px 'DM Sans'}.mini{border:0;background:#edf4ef;color:var(--green);border-radius:8px;padding:7px 9px;cursor:pointer;font-weight:700}.links{display:flex;gap:12px;align-items:center}.link{color:#2c7350;text-decoration:none;font-weight:700}.delete{border:0;background:none;color:#9b6d6d;cursor:pointer}.alt{background:#f5f9f6;border-radius:10px;padding:10px 12px;margin-top:9px;display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:12px}.alt a{color:#26734d;text-decoration:none;font-weight:700}.empty{grid-column:1/-1;text-align:center;padding:45px;color:var(--muted);background:white;border-radius:16px;border:1px dashed #cbd9cf}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#173b2c;color:white;padding:12px 18px;border-radius:10px;display:none;box-shadow:0 6px 24px #0002}.toast.show{display:block}.foot{margin:25px 0;color:#87938b;font-size:12px;text-align:center}
@media(max-width:760px){.shell{padding:18px 15px 40px}.hero{align-items:stretch;flex-direction:column}.hero h1{font-size:29px}.stats{gap:8px}.stat{padding:14px}.stat strong{font-size:20px}.grid{grid-template-columns:1fr}.topright{display:none}}@media(max-width:420px){.stats{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:span 2}.addbox{flex-direction:column}.addbox input{padding:12px}.btn{padding:12px}}
</style></head><body><main class="shell"><header class="top"><div class="brand"><div class="logo">↘</div>pricewise</div><div class="topright">Your personal price watchlist</div></header>
<section class="hero"><div><div class="eyebrow">Spend a little less</div><h1>Good deals find you.</h1><p>Track prices across your favourite Indian stores.</p></div><form class="addbox" id="addForm"><input id="url" type="url" placeholder="Paste an Amazon.in product link" required><button class="btn" id="addBtn">＋ Track product</button></form></section>
<div id="alertBanner"></div><section class="stats"><div class="stat"><small>Tracking now</small><strong id="total">—</strong></div><div class="stat"><small>Price drops to your target</small><strong id="alerts">—</strong></div><div class="stat"><small>Cheaper options found</small><strong id="deals">—</strong></div></section>
<div class="sectionhead"><h2>Your watchlist</h2><span class="count" id="count"></span></div><section class="grid" id="products"></section><div class="foot">Prices checked every 6 hours when a retailer allows it · Demo items are marked</div></main><div class="toast" id="toast"></div>
<script>
const money=n=>n==null?'—':'₹'+Number(n).toLocaleString('en-IN',{maximumFractionDigits:0});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function spark(history){if(!history?.length)return '';let vals=history.map(x=>Number(x.price)),lo=Math.min(...vals),hi=Math.max(...vals),span=hi-lo||1;let pts=vals.map((v,i)=>`${(i/(vals.length-1||1))*300},${62-(v-lo)/span*48}`).join(' ');return `<div class="chartwrap"><svg class="chart" viewBox="0 0 300 70" preserveAspectRatio="none"><defs><linearGradient id="fade" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#73b689" stop-opacity=".25"/><stop offset="1" stop-color="#73b689" stop-opacity="0"/></linearGradient></defs><polygon points="${pts} 300,70 0,70" fill="url(#fade)"/><polyline points="${pts}" fill="none" stroke="#43815c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`}
function card(p){let change=p.change, drop=change!=null&&change<0;let alternatives=p.alternatives||[];return `<article class="card"><div class="cardtop"><div class="thumb">${p.image_url?`<img src="${esc(p.image_url)}" onerror="this.remove()">`:'<span class="placeholder">▧</span>'}</div><div class="product"><h3>${esc(p.name)}</h3><div class="seller">${esc(p.seller)} ${p.status==='demo'?'<span class="badge">DEMO</span>':''}</div><div class="price">${money(p.price)} <span>${change!=null?`${drop?'↓':'↑'} ${money(Math.abs(change))} since added`:''}</span></div></div></div><div class="badges">${p.alert?'<span class="badge alert">Target reached · price dropped</span>':''}${alternatives.length?'<span class="badge cheaper">Cheaper option found</span>':''}${p.status!=='ok'&&p.status!=='demo'?`<span class="badge warn">${esc(p.status)}</span>`:''}</div>${spark(p.history)}<div class="meta"><span>Low ${money(p.lowest)} · High ${money(p.highest)}</span><span>${p.history?.length||0} snapshots</span></div><div class="targetrow"><span>${p.target?`Alert at <b>${money(p.target)}</b>`:'Set a price alert'}</span><div class="targetedit"><input type="number" min="1" step="1" placeholder="₹ target" id="target-${p.id}" value="${p.target||''}"><button class="mini" onclick="saveTarget(${p.id})">Save</button></div></div>${alternatives.map(a=>`<div class="alt"><span><b>${esc(a.retailer)}</b> · ${esc(a.name)}<br><span style="color:#718078">${esc(a.confidence)} · ${money(p.price-a.price)} less</span></span><a href="${esc(a.url)}" target="_blank" rel="noreferrer">${money(a.price)} ↗</a></div>`).join('')}<div class="targetrow"><span>${p.checked_at?'Checked '+new Date(p.checked_at).toLocaleString():'Not checked yet'}</span><div class="links"><a class="link" href="${esc(p.url)}" target="_blank" rel="noreferrer">View product ↗</a><button class="delete" onclick="removeProduct(${p.id})">Remove</button></div></div></article>`}
function toast(msg){let el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),3200)}
async function load(){let r=await fetch('/api/products'),ps=await r.json();document.getElementById('total').textContent=ps.length;document.getElementById('alerts').textContent=ps.filter(p=>p.alert).length;document.getElementById('deals').textContent=ps.filter(p=>p.alternatives?.length).length;document.getElementById('count').textContent=ps.length+' products';document.getElementById('products').innerHTML=ps.length?ps.map(card).join(''):'<div class="empty">Your watchlist is empty.<br>Paste a product link above to get started.</div>';let alerted=ps.filter(p=>p.alert);document.getElementById('alertBanner').innerHTML=alerted.length?`<div class="badge alert" style="padding:12px 16px;margin-bottom:15px">🔔 Price alert: ${alerted.map(p=>esc(p.name)).join(', ')} is at or below your target.</div>`:''}
document.getElementById('addForm').addEventListener('submit',async e=>{e.preventDefault();let btn=document.getElementById('addBtn');btn.disabled=true;btn.textContent='Checking…';try{let r=await fetch('/api/products',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:document.getElementById('url').value})}),d=await r.json();if(!r.ok)throw Error(d.detail||'Could not add product');document.getElementById('url').value='';toast('Product added to your watchlist');await load()}catch(e){toast(e.message)}finally{btn.disabled=false;btn.textContent='＋ Track product'}});
async function saveTarget(id){let value=document.getElementById('target-'+id).value;let r=await fetch(`/api/products/${id}/target`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({target:value?Number(value):null})});if(r.ok){toast('Price alert saved');load()}}
async function removeProduct(id){if(!confirm('Remove this product from your watchlist?'))return;let r=await fetch(`/api/products/${id}`,{method:'DELETE'});if(r.ok){toast('Product removed');load()}}
load();setInterval(load,60000);
</script></body></html>
